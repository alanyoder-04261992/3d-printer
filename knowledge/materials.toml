# Material data used by tools/check_print.py.
# Temps are typical ranges. The label on your actual spool wins; when a
# brand prints well at different numbers, change them here.
#
# outdoor   = holds up to sun and weather (shed hardware, signs, lot displays)
# enclosure = needs an enclosed printer to avoid warping/cracking

[PLA]
nozzle = [190, 220]
bed = [50, 65]
density = 1.24             # g/cm³
outdoor = false
enclosure = false
notes = "Easiest to print. Softens around 55 °C, so it warps in a hot shed or a car. Indoor only."

[PETG]
nozzle = [230, 250]
bed = [70, 85]
density = 1.27
outdoor = true
enclosure = false
notes = "Good default for outdoor parts. Tougher than PLA, some UV resistance. Strings a little."

[ASA]
nozzle = [240, 260]
bed = [90, 110]
density = 1.07
outdoor = true
enclosure = true
notes = "Best for parts living in full sun (signs, vents, trim). Needs an enclosure and ventilation."

[ABS]
nozzle = [230, 260]
bed = [90, 110]
density = 1.04
outdoor = false
enclosure = true
notes = "Heat resistant but yellows and gets brittle in UV. Use ASA instead for outdoor parts."

[TPU]
nozzle = [210, 235]
bed = [30, 60]
density = 1.21
outdoor = true
enclosure = false
notes = "Flexible. Bumpers, gaskets, door stops, feet. Print slow."
