# The printer every design in this repo is checked against.
# tools/check_print.py reads this file. Keep it matching the real machine.
#
# PLACEHOLDER: these numbers are a generic 220 mm bed-slinger (Ender-3 class).
# Replace them with your printer's specs and set confirmed = true.

[printer]
name = "UNCONFIRMED - replace with your printer model"
confirmed = false
firmware = "marlin"        # marlin | klipper | bambu | prusa
enclosure = false          # true if the printer is enclosed (matters for ASA/ABS)

[build_volume]
# Printable area in mm. x_min / y_min can be negative on printers that
# draw purge lines off the bed (Prusa MK3/MK4 use y_min = -4).
x_min = 0
x_max = 220
y_min = 0
y_max = 220
z_max = 250

[nozzle]
diameter = 0.4             # mm
max_temp = 260             # °C, hotend limit

[bed]
max_temp = 100             # °C

[defaults]
layer_height = 0.2         # mm
material = "PLA"           # must be a section in knowledge/materials.toml
max_overhang_deg = 45      # steeper than this (from vertical) needs support
